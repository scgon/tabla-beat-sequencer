<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Beat Sequencer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-deep: #0a0a0f;
            --bg-surface: #12121a;
            --bg-elevated: #1a1a26;
            --bg-hover: #222233;
            --accent-saffron: #ff6b2b;
            --accent-gold: #d4a039;
            --accent-warm: #e8935a;
            --accent-copper: #b87333;
            --text-primary: #f0ebe3;
            --text-secondary: #8a8599;
            --text-dim: #4a4660;
            --beat-active: #ff6b2b;
            --beat-glow: rgba(255, 107, 43, 0.3);
            --playhead: #ff6b2b;
            --border: rgba(255, 255, 255, 0.06);
            --border-accent: rgba(212, 160, 57, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background texture */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                    radial-gradient(ellipse at 20% 0%, rgba(255, 107, 43, 0.06) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 100%, rgba(212, 160, 57, 0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px 40px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo-area {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-saffron), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .logo-sub {
            font-size: 13px;
            font-weight: 300;
            color: var(--text-secondary);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Transport Controls */
        .transport {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn {
            border: none;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s ease;
        }

        .btn-play {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-saffron), #e04e15);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(255, 107, 43, 0.3);
        }

        .btn-play:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 28px rgba(255, 107, 43, 0.45);
        }

        .btn-play:active { transform: scale(0.96); }

        .btn-play svg { fill: white; width: 22px; height: 22px; }

        .btn-stop {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-stop:hover { background: var(--bg-hover); }
        .btn-stop svg { fill: var(--text-secondary); width: 14px; height: 14px; }

        .tempo-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .tempo-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-gold);
            min-width: 32px;
            text-align: center;
        }

        /* Transport slider controls */
        .swing-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 14px;
            height: 44px;
            box-sizing: border-box;
        }

        .swing-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            border-radius: 2px;
            background: var(--bg-hover);
            outline: none;
        }

        .swing-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-copper);
            cursor: pointer;
        }

        /* Beat numbers row */
        .beat-numbers {
            display: grid;
            gap: 3px;
            padding: 0 0 8px 0;
            margin-bottom: 2px;
            align-items: center;
        }

        .beat-numbers .spacer { }

        .beat-num {
            text-align: center;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        .beat-num.downbeat { color: var(--accent-gold); }

        /* Sequencer Grid */
        .sequencer {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            position: relative;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .sequencer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            opacity: 0.3;
        }

        .track-row {
            display: grid;
            gap: 3px;
            margin-bottom: 3px;
            align-items: center;
        }

        .track-row:last-child { margin-bottom: 0; }

        .track-label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            user-select: none;
        }

        .track-label:hover { background: var(--bg-hover); }

        .track-label .name {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Grid cells */
        .cell {
            aspect-ratio: 1;
            width: 100%;
            max-width: 42px;
            max-height: 42px;
            justify-self: center;
            border-radius: 6px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.12s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover {
            border-color: rgba(255, 107, 43, 0.3);
            background: var(--bg-hover);
        }

        .cell.active {
            border-color: transparent;
            box-shadow: 0 2px 12px var(--beat-glow);
        }

        .cell.active .cell-dot {
            transform: scale(1);
            opacity: 1;
        }

        .cell-dot {
            width: 60%;
            height: 60%;
            border-radius: 50%;
            transform: scale(0);
            opacity: 0;
            transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cell.downbeat {
            background: rgba(212, 160, 57, 0.06);
            border-color: rgba(212, 160, 57, 0.1);
        }

        /* Velocity colors */
        .cell.active.vel-high { background: rgba(255, 107, 43, 0.2); }
        .cell.active.vel-high .cell-dot { background: var(--accent-saffron); }

        .cell.active.vel-med { background: rgba(232, 147, 90, 0.15); }
        .cell.active.vel-med .cell-dot { background: var(--accent-warm); }

        .cell.active.vel-low { background: rgba(184, 115, 51, 0.12); }
        .cell.active.vel-low .cell-dot { background: var(--accent-copper); opacity: 0.7; }

        /* Playhead */
        .cell.playing {
            box-shadow: 0 0 16px rgba(255, 107, 43, 0.5), inset 0 0 8px rgba(255, 107, 43, 0.15);
            border-color: var(--accent-saffron) !important;
        }

        /* Playhead indicator */
        .playhead-row {
            display: grid;
            gap: 3px;
            /* Match the sequencer's 16px padding plus its 1px border. */
            margin: 6px 17px 0;
        }

        .playhead-indicator {
            height: 3px;
            width: 100%;
            max-width: 42px;
            justify-self: center;
            border-radius: 2px;
            background: transparent;
            transition: background 0.05s;
        }

        .playhead-indicator.active-head {
            background: var(--accent-saffron);
            box-shadow: 0 0 8px rgba(255, 107, 43, 0.6);
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .tool-btn {
            padding: 8px 16px;
            border-radius: 8px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .tool-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--border-accent);
        }

        .tool-btn.active {
            background: rgba(255, 107, 43, 0.12);
            border-color: rgba(255, 107, 43, 0.3);
            color: var(--accent-saffron);
        }

        .pattern-dialog {
            width: min(640px, calc(100vw - 32px));
            margin: auto;
            padding: 0;
            color: var(--text-primary);
            background: var(--bg-surface);
            border: 1px solid var(--border-accent);
            border-radius: 14px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
        }

        .pattern-dialog::backdrop { background: rgba(5, 5, 10, 0.7); }

        .pattern-dialog form { padding: 20px; }

        .pattern-dialog h2 {
            font-size: 17px;
            margin-bottom: 6px;
        }

        .pattern-dialog p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 14px;
        }

        .pattern-dialog textarea {
            width: 100%;
            min-height: 270px;
            resize: vertical;
            padding: 12px;
            color: var(--text-primary);
            background: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: 8px;
            font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .pattern-dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 14px;
        }

        .pattern-dialog-actions button { font-family: 'Outfit', sans-serif; }

        .pattern-dialog-actions .primary {
            color: #1a0d08;
            background: var(--accent-saffron);
            border-color: var(--accent-saffron);
        }

        .track-volume-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding-left: 8px;
            border-left: 1px solid rgba(255, 255, 255, 0.04);
            min-height: 36px;
        }

        .track-volume-control input[type="range"] {
            width: 52px;
            accent-color: var(--accent-saffron);
            cursor: pointer;
        }

        .track-volume-value {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        /* Presets */
        .presets {
            margin-top: 24px;
        }

        .presets-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .preset-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .preset-btn {
            padding: 10px 18px;
            border-radius: 10px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-btn:hover {
            border-color: var(--border-accent);
            color: var(--accent-gold);
            background: var(--bg-elevated);
            transform: translateY(-1px);
        }

        .preset-btn.active-preset {
            border-color: var(--accent-saffron);
            color: var(--accent-saffron);
            background: rgba(255, 107, 43, 0.08);
        }

        .preset-btn .preset-meta {
            font-size: 12px;
            margin-left: 4px;
            color: var(--accent-copper);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .header { flex-direction: column; gap: 16px; align-items: flex-start; }
            .transport { flex-wrap: wrap; }
            .track-label .name { font-size: 10px; }
            .cell { max-height: 36px; max-width: 36px; }
            .playhead-indicator { max-width: 36px; }
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .playing-anim {
            animation: pulse 0.15s ease;
        }

        /* Track color coding (nth-child offset by 1 for beat-numbers row) */
        .track-row:nth-child(2) .cell.active .cell-dot { background: #ff6b2b; }
        .track-row:nth-child(3) .cell.active .cell-dot { background: #e8935a; }
        .track-row:nth-child(4) .cell.active .cell-dot { background: #d4a039; }
        .track-row:nth-child(5) .cell.active .cell-dot { background: #cc8844; }
        .track-row:nth-child(6) .cell.active .cell-dot { background: #c47a50; }
        .track-row:nth-child(7) .cell.active .cell-dot { background: #b87333; }
        .track-row:nth-child(8) .cell.active .cell-dot { background: #cd7f5e; }
        .track-row:nth-child(9) .cell.active .cell-dot { background: #e0a870; }
        .track-row:nth-child(10) .cell.active .cell-dot { background: #c9956b; }
        .track-row:nth-child(11) .cell.active .cell-dot { background: #d48a5a; }
        .track-row:nth-child(12) .cell.active .cell-dot { background: #a67b5b; }

        .track-row:nth-child(2) .cell.active { background: rgba(255,107,43,0.15); }
        .track-row:nth-child(3) .cell.active { background: rgba(232,147,90,0.12); }
        .track-row:nth-child(4) .cell.active { background: rgba(212,160,57,0.12); }
        .track-row:nth-child(5) .cell.active { background: rgba(204,136,68,0.12); }
        .track-row:nth-child(6) .cell.active { background: rgba(196,122,80,0.1); }
        .track-row:nth-child(7) .cell.active { background: rgba(184,115,51,0.1); }
        .track-row:nth-child(8) .cell.active { background: rgba(205,127,94,0.1); }
        .track-row:nth-child(9) .cell.active { background: rgba(224,168,112,0.1); }
        .track-row:nth-child(10) .cell.active { background: rgba(201,149,107,0.1); }
        .track-row:nth-child(11) .cell.active { background: rgba(212,138,90,0.1); }
        .track-row:nth-child(12) .cell.active { background: rgba(166,123,91,0.1); }
    </style>
</head>
<body>

<div class="app">
    <header class="header">
        <div class="logo-area">
            <div class="logo">TAAL</div>
            <div class="logo-sub">Tabla Sequencer</div>
        </div>
        <div class="transport">
            <button class="btn btn-play" id="playBtn" title="Play / Pause">
                <svg id="playIcon" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
            </button>
            <button class="btn btn-stop" id="stopBtn" title="Stop">
                <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
            </button>
            <div class="swing-control">
                <span class="tempo-label">BPM</span>
                <input type="range" class="swing-slider" id="tempoSlider" min="40" max="480" value="120">
                <span class="tempo-value" id="tempoDisplay">120</span>
            </div>
            <div class="swing-control">
                <span class="tempo-label">Swing</span>
                <input type="range" class="swing-slider" id="swingSlider" min="0" max="50" value="0">
                <span class="tempo-value" id="swingDisplay">0</span>
            </div>
            <div class="swing-control">
                <span class="tempo-label">Beats</span>
                <span class="tempo-value" id="beatsValue">16</span>
            </div>
        </div>
    </header>

    <div class="sequencer" id="sequencer"></div>

    <div class="playhead-row" id="playheadRow">
        <div></div>
    </div>

<div class="toolbar">
            <button class="tool-btn" id="clearBtn">Clear All</button>
            <button class="tool-btn" id="randomBtn">Random</button>
            <button class="tool-btn" id="copyBtn">Copy Pattern</button>
            <button class="tool-btn" id="importBtn">Import Pattern</button>
        </div>

    <div class="presets">
        <div class="presets-title">Taal Presets</div>
        <div class="preset-row">
            <button class="preset-btn" data-preset="teental">Teental <span class="preset-meta">· 16</span></button>
            <button class="preset-btn" data-preset="jhaptal">Jhaptal <span class="preset-meta">· 10</span></button>
            <button class="preset-btn" data-preset="rupak">Rupak <span class="preset-meta">· 7</span></button>
            <button class="preset-btn" data-preset="dadra">Dadra <span class="preset-meta">· 6</span></button>
            <button class="preset-btn" data-preset="keherwa">Keherwa <span class="preset-meta">· 8</span></button>
        </div>
    </div>

    <dialog class="pattern-dialog" id="importDialog" aria-labelledby="importDialogTitle">
        <form method="dialog">
            <h2 id="importDialogTitle">Import Pattern</h2>
            <p>Paste the complete pattern data here.</p>
            <textarea id="importPatternData" aria-label="Pattern data" spellcheck="false"></textarea>
            <div class="pattern-dialog-actions">
                <button class="tool-btn" value="cancel">Cancel</button>
                <button class="tool-btn primary" value="import">Import Pattern</button>
            </div>
        </form>
    </dialog>
</div>

<script>
    // ===== AUDIO ENGINE =====
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function ensureAudio() {
        if (!audioCtx) {
            audioCtx = new AudioCtx();
            masterGain = null;
            compressor = null;
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // Tabla sound synthesis using lightly detuned membrane modes and filtered attacks.
    function partial(freq, amp, decay, startTime, options = {}) {
        const {
            attack = Math.min(0.002, decay * 0.2),
            detune = 0.006,
            startRatio = 1,
            glide = Math.min(0.05, decay * 0.55),
        } = options;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const variedFreq = freq * (1 + (Math.random() * 2 - 1) * detune);
        const peak = Math.max(0.0001, amp * (0.94 + Math.random() * 0.12));
        const attackEnd = startTime + Math.max(0.0004, Math.min(attack, decay * 0.35));
        osc.type = 'sine';
        osc.frequency.setValueAtTime(variedFreq * startRatio, startTime);
        if (startRatio !== 1) {
            osc.frequency.exponentialRampToValueAtTime(variedFreq, startTime + Math.max(0.004, glide));
        }
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(peak, attackEnd);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + decay);
        osc.connect(gain);
        osc.start(startTime);
        osc.stop(startTime + decay + 0.03);
        return gain;
    }

    function noiseBurst(filterType, filterFreq, filterQ, amp, decay, startTime, options = {}) {
        const {
            attack = Math.min(0.001, decay * 0.25),
            frequencyEnd = filterFreq,
            qEnd = filterQ,
        } = options;
        const bufLen = Math.max(1, Math.ceil(audioCtx.sampleRate * (decay + 0.005)));
        const buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) {
            d[i] = (Math.random() * 2 - 1) * (0.95 + Math.random() * 0.1);
        }
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const filt = audioCtx.createBiquadFilter();
        filt.type = filterType;
        filt.frequency.setValueAtTime(filterFreq, startTime);
        filt.Q.setValueAtTime(filterQ, startTime);
        if (frequencyEnd !== filterFreq) {
            filt.frequency.exponentialRampToValueAtTime(Math.max(1, frequencyEnd), startTime + decay);
        }
        if (qEnd !== filterQ) filt.Q.linearRampToValueAtTime(qEnd, startTime + decay);
        const env = audioCtx.createGain();
        const attackEnd = startTime + Math.max(0.0002, Math.min(attack, decay * 0.35));
        env.gain.setValueAtTime(0.0001, startTime);
        env.gain.exponentialRampToValueAtTime(Math.max(0.0001, amp), attackEnd);
        env.gain.exponentialRampToValueAtTime(0.0001, startTime + decay);
        src.connect(filt).connect(env);
        src.start(startTime);
        src.stop(startTime + decay + 0.01);
        return env;
    }

    // Master output with limiter
    let masterGain = null;
    let compressor = null;
    let dryGain = null;
    let room = null;
    let roomGain = null;

    function createRoomImpulse() {
        const duration = 0.11;
        const length = Math.ceil(audioCtx.sampleRate * duration);
        const impulse = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
        const data = impulse.getChannelData(0);
        for (let i = 0; i < length; i++) {
            const envelope = Math.pow(1 - i / length, 5);
            data[i] = (Math.random() * 2 - 1) * envelope * 0.13;
        }
        return impulse;
    }

    function getMaster() {
        if (!masterGain) {
            compressor = audioCtx.createDynamicsCompressor();
            compressor.threshold.value = -10;
            compressor.knee.value = 10;
            compressor.ratio.value = 3;
            compressor.attack.value = 0.006;
            compressor.release.value = 0.18;
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.72;
            dryGain = audioCtx.createGain();
            dryGain.gain.value = 0.94;
            room = audioCtx.createConvolver();
            room.buffer = createRoomImpulse();
            room.normalize = false;
            roomGain = audioCtx.createGain();
            roomGain.gain.value = 0.055;
            compressor.connect(dryGain).connect(masterGain);
            compressor.connect(room).connect(roomGain).connect(masterGain);
            masterGain.connect(audioCtx.destination);
        }
        return compressor;
    }

    function addModes(dest, at, level, modes, options = {}) {
        const { decayScale = 1, detune = 0.006 } = options;
        modes.forEach(([frequency, amplitude, decay, startRatio = 1]) => {
            const mode = partial(frequency, level * amplitude, decay * decayScale, at, {
                detune,
                startRatio,
            });
            mode.connect(dest);
        });
    }

    function playNaAt(dest, at, level, options = {}) {
        const { decayScale = 1, brightness = 1 } = options;
        const click = noiseBurst('bandpass', 2900 * brightness, 1.6, level * 0.16, 0.006 * decayScale, at);
        click.connect(dest);
        const skin = noiseBurst('bandpass', 1050 * brightness, 1.1, level * 0.07, 0.038 * decayScale, at, {
            frequencyEnd: 760 * brightness,
        });
        skin.connect(dest);
        addModes(dest, at, level, [
            [430, 0.12, 0.08],
            [565, 0.27, 0.16],
            [760, 0.23, 0.14],
            [1005, 0.11, 0.09],
            [1280, 0.05, 0.055],
        ], { decayScale, detune: 0.01 });
    }

    function playTinAt(dest, at, level, options = {}) {
        const { decayScale = 1 } = options;
        const click = noiseBurst('highpass', 3150, 0.8, level * 0.085, 0.005 * decayScale, at);
        click.connect(dest);
        const skin = noiseBurst('bandpass', 1750, 1.1, level * 0.035, 0.025 * decayScale, at, {
            frequencyEnd: 1250,
        });
        skin.connect(dest);
        addModes(dest, at, level, [
            [292, 0.38, 0.68, 1.012],
            [562, 0.29, 0.54, 1.008],
            [842, 0.22, 0.43, 1.006],
            [1128, 0.11, 0.27],
            [1402, 0.055, 0.18],
        ], { decayScale, detune: 0.004 });
    }

    function playTunAt(dest, at, level, options = {}) {
        const { decayScale = 1 } = options;
        const touch = noiseBurst('lowpass', 1350, 0.7, level * 0.07, 0.01 * decayScale, at);
        touch.connect(dest);
        addModes(dest, at, level, [
            [270, 0.42, 0.92, 1.008],
            [505, 0.17, 0.58],
            [748, 0.18, 0.5],
            [990, 0.1, 0.34],
            [1245, 0.045, 0.22],
        ], { decayScale, detune: 0.004 });
    }

    function playGeAt(dest, at, level, options = {}) {
        const { decayScale = 1 } = options;
        const thud = noiseBurst('lowpass', 430, 0.75, level * 0.18, 0.03 * decayScale, at, {
            frequencyEnd: 180,
        });
        thud.connect(dest);
        const skin = noiseBurst('bandpass', 230, 0.9, level * 0.09, 0.075 * decayScale, at, {
            frequencyEnd: 145,
        });
        skin.connect(dest);
        addModes(dest, at, level, [
            [74, 0.52, 0.58, 1.52],
            [112, 0.2, 0.38, 1.22],
            [185, 0.09, 0.22],
            [294, 0.05, 0.13],
        ], { decayScale, detune: 0.016 });
    }

    function playKeAt(dest, at, level, options = {}) {
        const { decayScale = 1 } = options;
        const slap = noiseBurst('bandpass', 520, 1.1, level * 0.2, 0.027 * decayScale, at, {
            frequencyEnd: 260,
        });
        slap.connect(dest);
        const click = noiseBurst('bandpass', 1550, 1.5, level * 0.065, 0.008 * decayScale, at);
        click.connect(dest);
        addModes(dest, at, level, [
            [118, 0.19, 0.045, 1.34],
            [205, 0.06, 0.03],
        ], { decayScale, detune: 0.02 });
    }

    function playDhaAt(dest, at, level, options = {}) {
        const { decayScale = 1 } = options;
        playGeAt(dest, at, level * 0.68, { decayScale: 0.78 * decayScale });
        playNaAt(dest, at + 0.0012, level * 0.92, { decayScale: 0.9 * decayScale });
    }

    function playDhinAt(dest, at, level, options = {}) {
        const { decayScale = 1 } = options;
        playGeAt(dest, at, level * 0.6, { decayScale: 0.78 * decayScale });
        playTinAt(dest, at + 0.0008, level * 0.88, { decayScale: 0.86 * decayScale });
    }

    function playDhiAt(dest, at, level, options = {}) {
        playDhinAt(dest, at, level, options);
    }

    function playRAt(dest, at, level, options = {}) {
        const { decayScale = 1 } = options;
        playNaAt(dest, at, level * 0.72, { decayScale: 0.32 * decayScale, brightness: 1.08 });
    }

    function playDhirDhirAt(dest, at, level, stepDur) {
        const gap = stepDur / 4;
        playDhiAt(dest, at, level * 0.55, { decayScale: 0.38 });
        playRAt(dest, at + gap, level * 0.42, { decayScale: 0.3 });
        playDhiAt(dest, at + gap * 2, level * 0.5, { decayScale: 0.36 });
        playRAt(dest, at + gap * 3, level * 0.38, { decayScale: 0.28 });
    }

    function playTablaSound(type, velocity = 1.0, stepDur = 0.125) {
        ensureAudio();
        const now = audioCtx.currentTime;
        const v = velocity * 0.5;
        const dest = getMaster();
        // stepDur = duration of one 16th note in seconds (passed from caller)
        // Compound bols use fractions of stepDur for sub-bol spacing

        switch(type) {

            // ============================================================
            // NA / TA — Dayan, ring finger mutes, index strikes edge
            // Fundamental suppressed (~270Hz muted). Prominent energy at
            // ~550Hz, ~770Hz double peak, ~1000Hz. Short-medium sustain.
            // Sharp attack transient. Damped resonance.
            // ============================================================
            case 'na': {
                playNaAt(dest, now, v);
                break;
            }

            // ============================================================
            // TIN / TEEN — Dayan, open resonant bell-like ring
            // Fundamental ~300Hz, harmonics at ~550Hz, ~810Hz. Long sustain.
            // ============================================================
            case 'tin': {
                playTinAt(dest, now, v);
                break;
            }

            // ============================================================
            // TUN — Dayan, all fingers strike center and release
            // Fundamental ~272Hz, longest sustain. Harmonics at ~500,
            // 748, 984, 1248Hz.
            // ============================================================
            case 'tun': {
                playTunAt(dest, now, v);
                break;
            }

            // ============================================================
            // GE / GHE — Bayan (bass drum), open stroke
            // Deep bass ~100Hz with pitch bend, peaks at ~290Hz, ~450Hz.
            // ============================================================
            case 'ge': {
                playGeAt(dest, now, v);
                break;
            }

            // ============================================================
            // KE / KAT — Bayan, damped/closed stroke
            // Diffuse spectrum, rapidly decaying. No clear pitch.
            // ============================================================
            case 'ke': {
                playKeAt(dest, now, v);
                break;
            }

            // ============================================================
            // DHA — Both drums simultaneously: Ge (bayan) + Na (dayan)
            // ============================================================
            case 'dha': {
                playDhaAt(dest, now, v);
                break;
            }

            // ============================================================
            // DHIN — Both drums simultaneously: Ge (bayan) + Tin (dayan)
            // ============================================================
            case 'dhin': {
                playDhinAt(dest, now, v);
                break;
            }

            // ============================================================
            // TIRAKITA — Rapid 4-stroke ornamental pattern: Ti-Ra-Ki-Ta
            // Sub-bol gap scales with BPM: each sub-bol is spaced at
            // 1/4 of the step duration, so 4 sub-bols fill one step.
            // ============================================================
            case 'tirakita': {
                const gap = stepDur / 4;
                playTinAt(dest, now, v * 0.42, { decayScale: 0.2 });
                playNaAt(dest, now + gap, v * 0.48, { decayScale: 0.18, brightness: 1.08 });
                playKeAt(dest, now + gap * 2, v * 0.42, { decayScale: 0.2 });
                playNaAt(dest, now + gap * 3, v * 0.46, { decayScale: 0.18, brightness: 1.12 });
                break;
            }

            // ============================================================
            // TAK — Two articulated sounds: Ta-K.
            // Each stroke occupies half of the step so they remain distinct.
            // ============================================================
            case 'tak': {
                const gap = stepDur / 2;
                playNaAt(dest, now, v * 0.72, { decayScale: 0.3, brightness: 1.12 });
                playKeAt(dest, now + gap, v * 0.48, { decayScale: 0.32 });
                break;
            }

            // ============================================================
            // TETE (Ti-Ta) — Dayan, double damped stroke on syahi
            // Two sub-bols evenly divide the step duration.
            // ============================================================
            case 'tete': {
                const gap = stepDur / 2;
                playNaAt(dest, now, v * 0.48, { decayScale: 0.28, brightness: 1.04 });
                playNaAt(dest, now + gap, v * 0.43, { decayScale: 0.24, brightness: 1.1 });
                break;
            }

            // ============================================================
            // DHIRDHIR — Four articulated sounds: Dhi-R-Dhi-R.
            // The four strokes evenly divide the step and stay BPM-aware.
            // ============================================================
            case 'dhirdhir': {
                playDhirDhirAt(dest, now, v, stepDur);
                break;
            }
        }
    }

    // ===== SEQUENCER STATE =====
    const TRACKS = [
        { id: 'na', name: 'Na', type: 'na' },
        { id: 'tin', name: 'Tin', type: 'tin' },
        { id: 'tun', name: 'Tun', type: 'tun' },
        { id: 'tak', name: 'Tak', type: 'tak' },
        { id: 'tete', name: 'TeTe', type: 'tete' },
        { id: 'ge', name: 'Ge', type: 'ge' },
        { id: 'ke', name: 'Ke', type: 'ke' },
        { id: 'dha', name: 'Dha', type: 'dha' },
        { id: 'dhin', name: 'Dhin', type: 'dhin' },
        { id: 'dhirdhir', name: 'DhirDhir', type: 'dhirdhir' },
        { id: 'tirakita', name: 'Trkta', type: 'tirakita' },
    ];

    let steps = 16; // DYNAMIC step count
    let grid = {};
    let currentStep = -1;
    let isPlaying = false;
    let tempo = 120;
    let swing = 0;
    let currentVelocity = 'high';
    let schedulerTimerId = null;
    const trackVolumes = {};

    function getStepDurationSeconds() {
        return 60 / tempo;
    }

    function getTrackVolume(trackId) {
        if (trackVolumes[trackId] === undefined) trackVolumes[trackId] = 100;
        return Number(trackVolumes[trackId]);
    }

    function getTrackVolumeMultiplier(trackId) {
        const pct = Math.max(20, Math.min(140, getTrackVolume(trackId)));
        return pct / 100;
    }

    function getVelocityValue(trackId, vel) {
        const velMap = { high: 1.0, med: 0.6, low: 0.3 };
        return (velMap[vel] || velMap.high) * getTrackVolumeMultiplier(trackId);
    }

    // Initialize grid
    function initGrid(numSteps) {
        TRACKS.forEach(t => {
            grid[t.id] = new Array(numSteps).fill(null);
            if (trackVolumes[t.id] === undefined) trackVolumes[t.id] = 100;
        });
    }

    initGrid(steps);

    // Helper: get CSS grid-template-columns for current step count
    function gridCols() {
        return `140px repeat(${steps}, minmax(18px, 1fr)) 70px`;
    }

    // Downbeat positions vary per taal - we compute based on step groupings
    // For most taals, we mark the first beat of each vibhag (section)
    let downbeats = [0, 4, 8, 12]; // default for 16 (teental)

    function getDefaultDownbeats(numSteps) {
        // Sensible defaults based on common groupings
        switch(numSteps) {
            case 16: return [0, 4, 8, 12];     // Teental: 4+4+4+4
            case 10: return [0, 2, 5, 7];       // Jhaptal: 2+3+2+3
            case 7:  return [0, 3, 5];          // Rupak: 3+2+2
            case 6:  return [0, 3];             // Dadra: 3+3
            case 8:  return [0, 4];             // Keherwa: 4+4
            default: {
                const db = [];
                for (let i = 0; i < numSteps; i += 4) db.push(i);
                return db;
            }
        }
    }

    // ===== BUILD UI =====
    function setStepCount(numSteps, newDownbeats) {
        const wasPlaying = isPlaying;
        if (wasPlaying) stopPlayback();

        steps = numSteps;
        downbeats = newDownbeats || getDefaultDownbeats(numSteps);

        // Update beats display
        document.getElementById('beatsValue').textContent = steps;

        rebuildAll();

        if (wasPlaying) startPlayback();
    }

    function rebuildAll() {
        buildGrid();
        buildPlayheadRow();
    }

    function buildGrid() {
        const seq = document.getElementById('sequencer');
        seq.innerHTML = '';

        // Beat numbers as first row inside the sequencer
        const beatRow = document.createElement('div');
        beatRow.className = 'beat-numbers';
        beatRow.style.gridTemplateColumns = gridCols();
        const spacer = document.createElement('div');
        spacer.className = 'spacer';
        beatRow.appendChild(spacer);
        for (let s = 0; s < steps; s++) {
            const num = document.createElement('div');
            num.className = `beat-num${downbeats.includes(s) ? ' downbeat' : ''}`;
            num.textContent = s + 1;
            beatRow.appendChild(num);
        }
        const beatSpacer = document.createElement('div');
        beatSpacer.className = 'playhead-spacer';
        beatRow.appendChild(beatSpacer);
        seq.appendChild(beatRow);

        TRACKS.forEach((track, ti) => {
            const row = document.createElement('div');
            row.className = 'track-row';
            row.style.gridTemplateColumns = gridCols();

            const label = document.createElement('div');
            label.className = 'track-label';
            label.innerHTML = `
      <span class="name">${track.name}</span>
    `;
            label.addEventListener('click', () => {
                ensureAudio();
                const stepDur = getStepDurationSeconds();
                playTablaSound(track.type, 0.9, stepDur);
            });
            row.appendChild(label);

            for (let s = 0; s < steps; s++) {
                const cell = document.createElement('div');
                const isDownbeat = downbeats.includes(s);
                cell.className = `cell${isDownbeat ? ' downbeat' : ''}`;
                cell.dataset.track = track.id;
                cell.dataset.step = s;
                cell.innerHTML = '<div class="cell-dot"></div>';

                cell.addEventListener('mousedown', (e) => {
                    if (e.button === 0) { // left click only
                        e.preventDefault();
                        startDrag(track.id, s, cell);
                    }
                });

                cell.addEventListener('mouseover', (e) => {
                    if (isDragging) {
                        applyCell(track.id, s, cell);
                    }
                });

                // Touch support
                cell.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    startDrag(track.id, s, cell);
                }, { passive: false });

                cell.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    cycleVelocity(track.id, s, cell);
                });

                if (grid[track.id][s]) {
                    cell.classList.add('active', `vel-${grid[track.id][s]}`);
                }

                row.appendChild(cell);
            }

            const volumeWrap = document.createElement('div');
            volumeWrap.className = 'track-volume-control';

            const volumeSlider = document.createElement('input');
            volumeSlider.type = 'range';
            volumeSlider.min = '20';
            volumeSlider.max = '140';
            volumeSlider.value = String(getTrackVolume(track.id));
            volumeSlider.title = `${track.name} volume`;
            volumeSlider.setAttribute('aria-label', `${track.name} volume`);

            const volumeValue = document.createElement('span');
            volumeValue.className = 'track-volume-value';
            volumeValue.textContent = `${getTrackVolume(track.id)}%`;

            volumeSlider.addEventListener('input', (e) => {
                const value = Number(e.target.value);
                trackVolumes[track.id] = value;
                volumeValue.textContent = `${value}%`;
            });

            volumeWrap.appendChild(volumeSlider);
            volumeWrap.appendChild(volumeValue);
            row.appendChild(volumeWrap);
            seq.appendChild(row);
        });

        // Touch move handler for drag painting on mobile
        seq.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const touch = e.touches[0];
            const el = document.elementFromPoint(touch.clientX, touch.clientY);
            if (el) {
                const target = el.closest('.cell');
                if (target) {
                    const trackId = target.dataset.track;
                    const step = parseInt(target.dataset.step);
                    if (trackId && !isNaN(step)) {
                        applyCell(trackId, step, target);
                    }
                }
            }
        }, { passive: false });
    }

    function buildPlayheadRow() {
        const row = document.getElementById('playheadRow');
        row.innerHTML = '<div></div>';
        row.style.gridTemplateColumns = gridCols();
        for (let s = 0; s < steps; s++) {
            const ind = document.createElement('div');
            ind.className = 'playhead-indicator';
            ind.dataset.step = s;
            row.appendChild(ind);
        }
        const spacer = document.createElement('div');
        spacer.className = 'playhead-spacer';
        row.appendChild(spacer);
    }

    // ===== INTERACTIONS =====
    // Drag painting state
    let isDragging = false;
    let dragMode = null; // 'fill' or 'clear'

    function applyCell(trackId, step, cellEl) {
        if (dragMode === 'fill') {
            if (!grid[trackId][step]) {
                grid[trackId][step] = currentVelocity;
                cellEl.classList.add('active', `vel-${currentVelocity}`);
                ensureAudio();
                const track = TRACKS.find(t => t.id === trackId);
                const stepDur = getStepDurationSeconds();
                playTablaSound(track.type, getVelocityValue(trackId, currentVelocity), stepDur);
            }
        } else if (dragMode === 'clear') {
            if (grid[trackId][step]) {
                grid[trackId][step] = null;
                cellEl.classList.remove('active', 'vel-high', 'vel-med', 'vel-low');
            }
        }
    }

    function startDrag(trackId, step, cellEl) {
        isDragging = true;
        // If cell is active, we're erasing; if empty, we're filling
        dragMode = grid[trackId][step] ? 'clear' : 'fill';
        applyCell(trackId, step, cellEl);
    }

    function continueDrag(e) {
        if (!isDragging) return;
        // Get the element under the pointer (works for mouse; touch handled separately)
        const target = e.target.closest('.cell');
        if (!target) return;
        const trackId = target.dataset.track;
        const step = parseInt(target.dataset.step);
        if (trackId && !isNaN(step)) {
            applyCell(trackId, step, target);
        }
    }

    function endDrag() {
        isDragging = false;
        dragMode = null;
    }

    // Global listeners for drag end
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('mouseleave', endDrag);
    document.addEventListener('touchend', endDrag);
    document.addEventListener('touchcancel', endDrag);

    function toggleCell(trackId, step, cellEl) {
        if (grid[trackId][step]) {
            grid[trackId][step] = null;
            cellEl.classList.remove('active', 'vel-high', 'vel-med', 'vel-low');
        } else {
            grid[trackId][step] = currentVelocity;
            cellEl.classList.add('active', `vel-${currentVelocity}`);
            ensureAudio();
            const track = TRACKS.find(t => t.id === trackId);
            const stepDur = getStepDurationSeconds();
            playTablaSound(track.type, getVelocityValue(trackId, currentVelocity), stepDur);
        }
    }

    function cycleVelocity(trackId, step, cellEl) {
        const vels = ['high', 'med', 'low'];
        const current = grid[trackId][step];
        if (!current) {
            grid[trackId][step] = 'high';
            cellEl.classList.add('active', 'vel-high');
        } else {
            const idx = vels.indexOf(current);
            const next = vels[(idx + 1) % 3];
            cellEl.classList.remove(`vel-${current}`);
            grid[trackId][step] = next;
            cellEl.classList.add(`vel-${next}`);
        }
    }

    // ===== PLAYBACK =====
    function startPlayback() {
        ensureAudio();
        isPlaying = true;
        currentStep = -1;
        updatePlayButton();
        scheduleNext();
    }

    function stopPlayback() {
        isPlaying = false;
        currentStep = -1;
        clearTimeout(schedulerTimerId);
        updatePlayButton();
        clearPlayhead();
    }

    function scheduleNext() {
        if (!isPlaying) return;

        currentStep = (currentStep + 1) % steps;
        const stepDuration = getStepDurationSeconds() * 1000;

        let delay = stepDuration;
        if (currentStep % 2 === 1 && swing > 0) {
            delay = stepDuration * (1 + swing / 100);
        } else if (currentStep % 2 === 0 && swing > 0) {
            delay = stepDuration * (1 - swing / 200);
        }

        playStep(currentStep);
        updatePlayhead(currentStep);

        schedulerTimerId = setTimeout(() => scheduleNext(), delay);
    }

    function playStep(step) {
        const stepDur = getStepDurationSeconds();
        TRACKS.forEach(track => {
            const vel = grid[track.id][step];
            if (vel) {
                playTablaSound(track.type, getVelocityValue(track.id, vel), stepDur);
            }
        });
    }

    function updatePlayhead(step) {
        document.querySelectorAll('.cell.playing').forEach(c => c.classList.remove('playing'));
        document.querySelectorAll('.playhead-indicator.active-head').forEach(c => c.classList.remove('active-head'));
        document.querySelectorAll(`.cell[data-step="${step}"]`).forEach(c => c.classList.add('playing'));
        const phInd = document.querySelector(`.playhead-indicator[data-step="${step}"]`);
        if (phInd) phInd.classList.add('active-head');
    }

    function clearPlayhead() {
        document.querySelectorAll('.cell.playing').forEach(c => c.classList.remove('playing'));
        document.querySelectorAll('.playhead-indicator.active-head').forEach(c => c.classList.remove('active-head'));
    }

    function updatePlayButton() {
        const icon = document.getElementById('playIcon');
        if (isPlaying) {
            icon.innerHTML = '<rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/>';
        } else {
            icon.innerHTML = '<polygon points="6,3 20,12 6,21"/>';
        }
    }

    // ===== PRESETS =====
    // Each preset now has a `steps` count, `downbeats` array, and pattern data, it works more now thatnkfully
    const PRESETS = {
        teental: {
            steps: 16,
            downbeats: [0, 4, 8, 12], // Sam, Taali, Khali, Taali
            pattern: {
                dha:  ['high',null,null,'high', 'high',null,null,'high', 'high',null,null,null, null,null,null,'high'],
                dhin: [null,'high','high',null, null,'high','high',null, null,null,null,null, null,'high','high',null],
                tin:  [null,null,null,null, null,null,null,null, null,'high','high',null, null,null,null,null],
                na:   [null,null,null,null, null,null,null,null, null,null,null,'high', 'high',null,null,null],
            }
        },
        jhaptal: {
            steps: 10,
            downbeats: [0, 2, 5, 7], // Sam(2), Taali(3), Khali(2), Taali(3)
            pattern: {
                dhin: ['high',null, 'high','high',null, null,null, 'high','high',null],
                na:   [null,'high', null,null,'high', null,'high', null,null,'high'],
                tin:  [null,null, null,null,null, 'high',null, null,null,null],
            }
        },
        rupak: {
            steps: 7,
            downbeats: [0, 3, 5], // Khali(3), Taali(2), Taali(2)
            pattern: {
                tin:  ['high','high',null, null,null, null,null],
                na:   [null,null,'high', null,'high', null,'high'],
                dhin: [null,null,null, 'high',null, 'high',null],
            }
        },
        dadra: {
            steps: 6,
            downbeats: [0, 3], // Sam(3), Taali(3)
            pattern: {
                dha:  ['high',null,null, 'high',null,null],
                dhin: [null,'high',null, null,null,null],
                na:   [null,null,'high', null,null,'high'],
                tin:  [null,null,null, null,'high',null],
            }
        },
        keherwa: {
            steps: 8,
            downbeats: [0, 4], // Sam(4), Taali(4)
            pattern: {
                dha:  ['high',null,null,null, null,null,null,null],
                ge:   [null,'high',null,null, null,null,null,null],
                na:   [null,null,'high',null, 'high',null,null,'high'],
                tin:  [null,null,null,'high', null,null,null,null],
                ke:   [null,null,null,null, null,'high',null,null],
                dhin: [null,null,null,null, null,null,'high',null],
            }
        },
    };

    function loadPreset(name) {
        const preset = PRESETS[name];
        if (!preset) return;

        // Update step count and downbeats
        steps = preset.steps;
        downbeats = preset.downbeats;

        // Re-init grid with new step count
        initGrid(steps);

        // Load preset pattern
        Object.keys(preset.pattern).forEach(trackId => {
            if (grid[trackId]) {
                grid[trackId] = [...preset.pattern[trackId]];
            }
        });

        // Update beats display
        document.getElementById('beatsValue').textContent = steps;

        // Rebuild everything
        rebuildAll();

        // Highlight active preset
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active-preset'));
        const activeBtn = document.querySelector(`.preset-btn[data-preset="${name}"]`);
        if (activeBtn) activeBtn.classList.add('active-preset');
    }

    // ===== EVENT LISTENERS =====
    document.getElementById('playBtn').addEventListener('click', () => {
        if (isPlaying) stopPlayback();
        else startPlayback();
    });

    document.getElementById('stopBtn').addEventListener('click', () => stopPlayback());

    document.getElementById('tempoSlider').addEventListener('input', (e) => {
        tempo = parseInt(e.target.value);
        document.getElementById('tempoDisplay').textContent = tempo;
    });

    document.getElementById('swingSlider').addEventListener('input', (e) => {
        swing = parseInt(e.target.value);
        document.getElementById('swingDisplay').textContent = swing;
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
        initGrid(steps);
        buildGrid();
    });

    document.getElementById('randomBtn').addEventListener('click', () => {
        TRACKS.forEach(t => {
            for (let s = 0; s < steps; s++) {
                const r = Math.random();
                if (r < 0.2) grid[t.id][s] = 'high';
                else if (r < 0.3) grid[t.id][s] = 'med';
                else if (r < 0.35) grid[t.id][s] = 'low';
                else grid[t.id][s] = null;
            }
        });
        buildGrid();
    });

    const PATTERN_V1 = 'TABLA PATTERN v1';
    const PATTERN_V2 = 'TABLA PATTERN v2';
    const VALID_VELOCITIES = new Set(['high', 'med', 'low']);

    function buildPatternText() {
        const lines = [
            PATTERN_V2,
            `BPM: ${tempo}`,
            `SWING: ${swing}`,
            `BEATS: ${steps}`,
            `DOWNBEATS: ${downbeats.join(',')}`,
        ];
        TRACKS.forEach(track => {
            lines.push(`${track.id}: ${grid[track.id].map(value => value || 'null').join(',')}`);
        });
        return lines.join('\n');
    }

    async function copyPatternText(text) {
        if (navigator.clipboard && window.isSecureContext) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (_) {
                // Fall through for browsers that deny the Clipboard API.
            }
        }

        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.setAttribute('readonly', '');
        textArea.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
        document.body.appendChild(textArea);
        textArea.select();
        textArea.setSelectionRange(0, text.length);
        const copied = typeof document.execCommand === 'function' && document.execCommand('copy');
        textArea.remove();
        return copied;
    }

    function parsePatternText(text) {
        const lines = text.replace(/^\uFEFF/, '').trim().split(/\r?\n/).map(line => line.trim()).filter(Boolean);
        if (![PATTERN_V1, PATTERN_V2].includes(lines[0])) throw new Error('Unsupported pattern format');

        const isV2 = lines[0] === PATTERN_V2;
        const pattern = {
            bpm: tempo,
            swing,
            steps: null,
            downbeats: null,
            tracks: {},
        };

        for (const line of lines.slice(1)) {
            const separator = line.indexOf(':');
            if (separator === -1) continue;
            const key = line.slice(0, separator).trim();
            const value = line.slice(separator + 1).trim();
            if (key === 'BPM') pattern.bpm = Number(value);
            else if (key === 'SWING' && isV2) pattern.swing = Number(value);
            else if (key === 'BEATS') pattern.steps = Number(value);
            else if (key === 'DOWNBEATS' && isV2) {
                pattern.downbeats = value ? value.split(',').map(item => Number(item.trim())) : [];
            } else if (TRACKS.some(track => track.id === key)) {
                pattern.tracks[key] = value.split(',').map(item => {
                    const velocity = item.trim();
                    if (velocity === 'null') return null;
                    if (!VALID_VELOCITIES.has(velocity)) throw new Error(`Invalid velocity in ${key}`);
                    return velocity;
                });
            }
        }

        if (!Number.isInteger(pattern.steps) || pattern.steps < 1 || pattern.steps > 64) {
            throw new Error('BEATS must be a whole number from 1 to 64');
        }
        if (!Number.isInteger(pattern.bpm) || pattern.bpm < 40 || pattern.bpm > 480) {
            throw new Error('BPM must be a whole number from 40 to 480');
        }
        if (!Number.isInteger(pattern.swing) || pattern.swing < 0 || pattern.swing > 50) {
            throw new Error('SWING must be a whole number from 0 to 50');
        }
        if (Object.keys(pattern.tracks).length === 0) throw new Error('No track data found');

        for (const [trackId, values] of Object.entries(pattern.tracks)) {
            if (values.length !== pattern.steps) {
                throw new Error(`${trackId} has ${values.length} beats; expected ${pattern.steps}`);
            }
        }

        if (pattern.downbeats === null) pattern.downbeats = getDefaultDownbeats(pattern.steps);
        const uniqueDownbeats = [...new Set(pattern.downbeats)];
        if (!uniqueDownbeats.every(beat => Number.isInteger(beat) && beat >= 0 && beat < pattern.steps)) {
            throw new Error('DOWNBEATS contains an invalid beat');
        }
        pattern.downbeats = uniqueDownbeats;
        return pattern;
    }

    function updateButtonLabel(button, label) {
        const originalLabel = button.dataset.label || button.textContent;
        button.dataset.label = originalLabel;
        button.textContent = label;
        setTimeout(() => button.textContent = originalLabel, 1500);
    }

    document.getElementById('copyBtn').addEventListener('click', async () => {
        const text = buildPatternText();
        const button = document.getElementById('copyBtn');
        if (await copyPatternText(text)) {
            updateButtonLabel(button, 'Copied!');
        } else {
            prompt('Copy this pattern data:', text);
        }
    });

    function importPattern(text) {
        try {
            const pattern = parsePatternText(text);
            const wasPlaying = isPlaying;
            if (wasPlaying) stopPlayback();

            steps = pattern.steps;
            downbeats = pattern.downbeats;
            tempo = pattern.bpm;
            swing = pattern.swing;
            initGrid(steps);
            Object.entries(pattern.tracks).forEach(([trackId, values]) => {
                grid[trackId] = values;
            });

            document.getElementById('beatsValue').textContent = steps;
            document.getElementById('tempoSlider').value = tempo;
            document.getElementById('tempoDisplay').textContent = tempo;
            document.getElementById('swingSlider').value = swing;
            document.getElementById('swingDisplay').textContent = swing;
            document.querySelectorAll('.preset-btn').forEach(button => button.classList.remove('active-preset'));
            rebuildAll();
            if (wasPlaying) startPlayback();

            updateButtonLabel(document.getElementById('importBtn'), 'Imported!');
            return true;
        } catch (e) {
            alert('Failed to import pattern: ' + e.message);
            return false;
        }
    }

    const importDialog = document.getElementById('importDialog');
    const importPatternData = document.getElementById('importPatternData');

    document.getElementById('importBtn').addEventListener('click', () => {
        importPatternData.value = '';
        importDialog.showModal();
        importPatternData.focus();
    });

    importDialog.addEventListener('close', () => {
        if (importDialog.returnValue !== 'import' || !importPatternData.value.trim()) return;
        if (!importPattern(importPatternData.value)) {
            importDialog.showModal();
            importPatternData.focus();
        }
    });

    // Preset buttons
    document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', () => loadPreset(btn.dataset.preset));
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (isPlaying) stopPlayback();
            else startPlayback();
        }
    });

    // Initialize it all
    rebuildAll();
</script>

</body>
</html>
